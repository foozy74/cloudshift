version: '3.8'

services:
  database:
    image: docker.registry.it.internal/mariadb:10-jammy
    container_name: coriolis-db
    security_opt:
      - label:disable
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: coriolis
      MYSQL_USER: coriolis
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "13306:3306"
    volumes:
      - db_data:/var/lib/mysql:z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: docker.registry.it.internal/rabbitmq:3-management
    container_name: coriolis-rabbitmq
    security_opt:
      - label:disable
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?set RABBITMQ_ERLANG_COOKIE in .env}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-setcookie ${RABBITMQ_ERLANG_COOKIE:?set RABBITMQ_ERLANG_COOKIE in .env}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq:z
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-sync:
    image: docker.registry.it.internal/thesolution/cloudshift:latest
    container_name: coriolis-db-sync
    security_opt:
      - label:disable
    volumes:
      - ./docker/coriolis.conf:/etc/coriolis/coriolis.conf:ro,z
    command: ["coriolis-dbsync", "--config-file", "/etc/coriolis/coriolis.conf"]
    depends_on:
      database:
        condition: service_healthy

  api:
    image: docker.registry.it.internal/thesolution/cloudshift:latest
    container_name: coriolis-api
    security_opt:
      - label:disable
    ports:
      - "7667:7667"
    volumes:
      - ./docker/coriolis.conf:/etc/coriolis/coriolis.conf:ro,z
      - ./etc/coriolis/api-paste.ini:/etc/coriolis/api-paste.ini:ro,z
      - ./docker/users.yaml:/etc/coriolis/users.yaml:ro,z
      - ./etc/coriolis/policy.yaml:/etc/coriolis/policy.yaml:ro,z
    command: ["coriolis-api", "--config-file", "/etc/coriolis/coriolis.conf"]
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully

  conductor:
    image: docker.registry.it.internal/thesolution/cloudshift:latest
    container_name: coriolis-conductor
    security_opt:
      - label:disable
    volumes:
      - ./docker/coriolis.conf:/etc/coriolis/coriolis.conf:ro,z
    environment:
      - NO_PROXY=localhost,127.0.0.1,172.23.0.0/16,sb-v2v,.internal,.three.com
      - no_proxy=localhost,127.0.0.1,172.23.0.0/16,sb-v2v,.internal,.three.com
    command: ["coriolis-conductor", "--config-file", "/etc/coriolis/coriolis.conf"]
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully

  worker:
    image: docker.registry.it.internal/thesolution/cloudshift:latest
    container_name: coriolis-worker
    hostname: coriolis-worker
    security_opt:
      - label:disable
    volumes:
      - ./docker/coriolis.conf:/etc/coriolis/coriolis.conf:ro,z
    secrets:
      - olvm_minion_ssh_key
    environment:
      - NO_PROXY=localhost,127.0.0.1,172.23.0.0/16,sb-v2v,.internal,.three.com
      - no_proxy=localhost,127.0.0.1,172.23.0.0/16,sb-v2v,.internal,.three.com
    command: ["coriolis-worker", "--config-file", "/etc/coriolis/coriolis.conf"]
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully

  scheduler:
    image: docker.registry.it.internal/thesolution/cloudshift:latest
    container_name: coriolis-scheduler
    security_opt:
      - label:disable
    volumes:
      - ./docker/coriolis.conf:/etc/coriolis/coriolis.conf:ro,z
    command: ["coriolis-scheduler", "--config-file", "/etc/coriolis/coriolis.conf"]
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully

  minion-manager:
    image: docker.registry.it.internal/thesolution/cloudshift:latest
    container_name: coriolis-minion-manager
    security_opt:
      - label:disable
    volumes:
      - ./docker/coriolis.conf:/etc/coriolis/coriolis.conf:ro,z
    environment:
      - NO_PROXY=localhost,127.0.0.1,172.23.0.0/16,sb-v2v,.internal,.three.com
      - no_proxy=localhost,127.0.0.1,172.23.0.0/16,sb-v2v,.internal,.three.com
    command: ["coriolis-minion-manager", "--config-file", "/etc/coriolis/coriolis.conf"]
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully

  deployer-manager:
    image: docker.registry.it.internal/thesolution/cloudshift:latest
    container_name: coriolis-deployer-manager
    security_opt:
      - label:disable
    volumes:
      - ./docker/coriolis.conf:/etc/coriolis/coriolis.conf:ro,z
    environment:
      - NO_PROXY=localhost,127.0.0.1,172.23.0.0/16,sb-v2v,.internal,.three.com
      - no_proxy=localhost,127.0.0.1,172.23.0.0/16,sb-v2v,.internal,.three.com
    command: ["coriolis-deployer-manager", "--config-file", "/etc/coriolis/coriolis.conf"]
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully

  transfer-cron:
    image: docker.registry.it.internal/thesolution/cloudshift:latest
    container_name: coriolis-transfer-cron
    security_opt:
      - label:disable
    volumes:
      - ./docker/coriolis.conf:/etc/coriolis/coriolis.conf:ro,z
    command: ["coriolis-transfer-cron", "--config-file", "/etc/coriolis/coriolis.conf"]
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully

  dashboard:
    image: docker.registry.it.internal/thesolution/cloudshift-dashboard:v1.0.0
    container_name: coriolis-dashboard
    security_opt:
      - label:disable
    ports:
      - "443:443"
      - "8080:80"
    volumes:
      - ./docker/dashboard/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api

volumes:
  db_data:
  rabbitmq_data:

secrets:
  # Private SSH key for the OLVM minion (public key lives in the minion template).
  # Keep the file outside of git; override the location via OLVM_MINION_SSH_KEY_FILE.
  olvm_minion_ssh_key:
    file: ${OLVM_MINION_SSH_KEY_FILE:-./secrets/olvm_minion_ssh_key}
