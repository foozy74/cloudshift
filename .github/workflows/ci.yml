name: CloudShift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        architecture: ["x64"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmariadb-dev-compat libmariadb-dev pkg-config libxml2-dev libxslt-dev

    - name: Install tox
      run: |
        python3 -m pip install tox

    - name: Run unit tests
      run: |
        tox -e py3 -v

    - name: Run linting (PEP8 / flake8)
      run: |
        tox -e pep8 -v
