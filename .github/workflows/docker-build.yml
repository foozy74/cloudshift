name: Build and Publish Container Images

# Release images are built only here, from a git tag (e.g. 1.4.0 or v1.4.0).
# The internal registry docker.registry.it.internal mirrors Docker Hub, so the
# images are published to Docker Hub.
#
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# (Docker Hub access token with read/write scope for thesolution/*).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: thesolution/cloudshift
  DASHBOARD_IMAGE_NAME: thesolution/cloudshift-dashboard
  PLATFORMS: linux/amd64,linux/arm64
  # Artifactory is not reachable from GitHub-hosted runners.
  PIP_INDEX_URL: https://pypi.org/simple

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for CloudShift Core
        id: meta-core
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Extract metadata for CloudShift Dashboard
        id: meta-dashboard
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DASHBOARD_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # 1. Build amd64 images locally and verify them before anything is pushed.
      - name: Build CloudShift Core (verification)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: cloudshift-verify:core
          build-args: |
            PBR_VERSION=${{ steps.meta-core.outputs.version || '0.0.0' }}
            PIP_INDEX_URL=${{ env.PIP_INDEX_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build CloudShift Dashboard (verification)
        uses: docker/build-push-action@v5
        with:
          context: ./docker/dashboard
          file: ./docker/dashboard/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cloudshift-verify:dashboard

      - name: Verify images (no secrets, runtime files present)
        run: sh docker/verify-images.sh cloudshift-verify:core cloudshift-verify:dashboard

      # 2. Publish multi-arch images (amd64 layers come from the cache above).
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push CloudShift Core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          build-args: |
            PBR_VERSION=${{ steps.meta-core.outputs.version || '0.0.0' }}
            PIP_INDEX_URL=${{ env.PIP_INDEX_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push CloudShift Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./docker/dashboard
          file: ./docker/dashboard/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
