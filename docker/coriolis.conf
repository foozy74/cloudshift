[DEFAULT]
debug = true
verbose = true
default_requests_timeout = 600

# Use the rabbitmq container defined in docker-compose
transport_url = rabbit://guest:guest@rabbitmq:5672/
messaging_transport_url = rabbit://guest:guest@rabbitmq:5672/

providers = coriolis.providers.vmware.exp.VMwareVSphereExportProvider,coriolis.providers.olvm.imp.OLVMoVirtImportProvider

# ========== Database ==========
[database]
# Use the database container defined in docker-compose
connection = mysql+pymysql://coriolis:coriolis_password@database/coriolis?charset=utf8

# ========== API ==========
[api]
api_migration_listen = 0.0.0.0
api_migration_listen_port = 7667
api_migration_workers = 1
worker_count = 1


# ========== Concurrency ==========
[oslo_concurrency]
lock_path = /tmp

# ========== Replicator ==========
[replicator]
port = 4433
default_requests_timeout = 600

# ========== VMware (Export / Quelle) ==========
[vmware]
worker_ip = 172.23.219.61
worker_vm_name = sb-v2v
auto_attach_disks = True
worker_ssh_password = VMware.99

# ========== OLVM / oVirt (Import / Ziel) ==========
[olvm]
# Template-Name in OLVM für temporäre Minion-VMs (Data-Minions)
minion_template_name = sb-minion-template
minion_memory_mb = 4096
minion_vcpus = 2
writer_port = 6677

# ========== Authentication & Authorization ==========
[auth]
# Options: 'hybrid' (local then ldap), 'local', 'ldap', or 'none' (legacy)
auth_strategy = hybrid
jwt_secret_key = coriolis-production-secure-jwt-key-2026
token_expiration_hours = 8
local_users_file = /etc/coriolis/users.yaml

# ========== LDAP / Active Directory (LDAPS) ==========
[ldap]
enabled = false
url = ldaps://dc01.company.local:636
use_ssl = true
ca_cert_file = /etc/coriolis/ssl/ldap_ca.crt
insecure = false

# Service account for user search (optional if anonymous search allowed)
# bind_dn = CN=svc-coriolis,OU=ServiceAccounts,DC=company,DC=local
# bind_password = SecretServicePassword!

user_base_dn = OU=Users,DC=company,DC=local
user_search_filter = (&(objectClass=user)(sAMAccountName={username}))

group_base_dn = OU=Groups,DC=company,DC=local
group_attribute = memberOf
# Map LDAP groups to Coriolis roles (admin, operator, viewer)
# role_mapping = CN=CloudShift-Admins,OU=Groups,DC=company,DC=local:admin,CN=CloudShift-Operators,OU=Groups,DC=company,DC=local:operator
default_role = viewer




