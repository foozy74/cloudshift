<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudShift API — Swagger UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        html { box-sizing: border-box; overflow-y: scroll; }
        *, *:before, *:after { box-sizing: inherit; }

        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #0d1b2a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-elevated: rgba(255, 255, 255, 0.06);
            --border-color: rgba(125, 211, 192, 0.12);
            --border-input: rgba(125, 211, 192, 0.2);
            --text-main: #e8f1f5;
            --text-muted: #8899a6;
            --text-dim: #6b7a8a;
            --accent-cyan: #7dd3c0;
            --accent-blue: #5b9bd5;
            --accent-gradient: linear-gradient(135deg, #5b9bd5, #7dd3c0);
            --status-success: #10b981;
            --status-error: #ef4444;
            --status-warning: #f59e0b;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-heading: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg-primary);
            font-family: var(--font-main);
            color: var(--text-main);
        }

        /* ── Topbar ───────────────────────────────
           Hidden — the dashboard already provides the
           header/navigation. No double-header clutter. */
        .swagger-ui .topbar { display: none; }

        /* ── Wrapper offset — compensate for removed topbar ── */
        .swagger-ui .wrapper { padding: 0 20px; }
        .swagger-ui .info { margin-top: 12px; }

        /* ── Info section ───────────────────────── */
        .swagger-ui .info { margin: 24px 0; }
        .swagger-ui .info .title {
            font-family: var(--font-heading); font-size: 2rem; font-weight: 700;
            background: var(--accent-gradient); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; background-clip: text;
        }
        .swagger-ui .info .description .renderedMarkdown p,
        .swagger-ui .info .description .renderedMarkdown { color: var(--text-muted); font-size: 0.9rem; }
        .swagger-ui .info a { color: var(--accent-blue); }
        .swagger-ui .info hgroup .version { font-family: var(--font-main); }
        .swagger-ui .info li, .swagger-ui .info p, .swagger-ui .info table {
            font-family: var(--font-main); font-size: 0.85rem; color: var(--text-muted);
        }

        /* ── Schemes ────────────────────────────── */
        .swagger-ui .scheme-container {
            background: var(--bg-card);
            border-radius: 8px; border: 1px solid var(--border-color);
            box-shadow: none; margin: 0 0 20px; padding: 10px 20px;
        }
        .swagger-ui .scheme-container .servers-title,
        .swagger-ui .scheme-container .servers label { color: var(--text-muted); }
        .swagger-ui .scheme-container select {
            background: var(--bg-elevated); color: var(--text-main);
            border: 1px solid var(--border-input); border-radius: 6px;
            padding: 6px 12px; font-family: var(--font-main);
        }
        .swagger-ui .loading-container .loading:after { color: var(--accent-blue); }

        /* ── Tags ───────────────────────────────── */
        .swagger-ui .opblock-tag {
            font-family: var(--font-heading); font-size: 1.3rem; font-weight: 600;
            color: var(--text-main); border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px; margin-top: 24px;
        }
        .swagger-ui .opblock-tag:hover { color: var(--accent-cyan); }
        .swagger-ui .opblock-tag small { color: var(--text-muted); }
        .swagger-ui .opblock-tag svg { fill: var(--accent-cyan) !important; }

        /* ── Operation blocks ───────────────────── */
        .swagger-ui .opblock {
            margin: 0 0 10px; border-radius: 8px; border: 1px solid var(--border-color);
            box-shadow: none; background: var(--bg-card);
        }
        .swagger-ui .opblock .opblock-summary {
            padding: 10px 16px; border-bottom: 1px solid transparent;
        }
        .swagger-ui .opblock .opblock-summary:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .swagger-ui .opblock .opblock-summary-description {
            color: var(--text-muted); font-family: var(--font-main); font-size: 0.85rem;
        }
        .swagger-ui .opblock .opblock-summary-path {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            color: var(--text-main); font-weight: 500; font-size: 0.85rem;
        }
        .swagger-ui .opblock .opblock-summary-path a.nostyle { color: inherit; }

        /* ── HTTP method colors ─────────────────── */
        .swagger-ui .opblock.opblock-get {
            background: rgba(125, 211, 192, 0.04); border-color: rgba(125, 211, 192, 0.18);
        }
        .swagger-ui .opblock.opblock-post {
            background: rgba(91, 155, 213, 0.04); border-color: rgba(91, 155, 213, 0.18);
        }
        .swagger-ui .opblock.opblock-put {
            background: rgba(245, 158, 11, 0.04); border-color: rgba(245, 158, 11, 0.18);
        }
        .swagger-ui .opblock.opblock-delete {
            background: rgba(239, 68, 68, 0.04); border-color: rgba(239, 68, 68, 0.18);
        }

        .swagger-ui .opblock.opblock-get .opblock-summary-method {
            background: rgba(125, 211, 192, 0.15); color: var(--accent-cyan);
            font-weight: 600; text-shadow: none; border-radius: 6px; font-size: 0.75rem;
        }
        .swagger-ui .opblock.opblock-post .opblock-summary-method {
            background: rgba(91, 155, 213, 0.15); color: var(--accent-blue);
            font-weight: 600; text-shadow: none; border-radius: 6px; font-size: 0.75rem;
        }
        .swagger-ui .opblock.opblock-put .opblock-summary-method {
            background: rgba(245, 158, 11, 0.15); color: var(--status-warning);
            font-weight: 600; text-shadow: none; border-radius: 6px; font-size: 0.75rem;
        }
        .swagger-ui .opblock.opblock-delete .opblock-summary-method {
            background: rgba(239, 68, 68, 0.15); color: var(--status-error);
            font-weight: 600; text-shadow: none; border-radius: 6px; font-size: 0.75rem;
        }
        .swagger-ui .opblock .opblock-summary-operation-id,
        .swagger-ui .opblock .opblock-summary-request-url {
            color: var(--text-dim); font-family: var(--font-main); font-size: 0.78rem;
        }

        /* ── Opblock body (parameters, responses) ── */
        .swagger-ui .opblock-body {
            background: transparent; padding: 0;
        }
        .swagger-ui .opblock-body pre.microlight {
            background: rgba(0, 0, 0, 0.3) !important;
            border-radius: 6px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            color: var(--text-main); padding: 14px 16px; border: 1px solid var(--border-color);
        }
        .swagger-ui .opblock-body .opblock-section-header {
            background: var(--bg-elevated); border-bottom: 1px solid var(--border-color);
            border-radius: 0; padding: 10px 16px; min-height: auto;
        }
        .swagger-ui .opblock-body .opblock-section-header h4 {
            color: var(--text-main); font-family: var(--font-heading); font-size: 0.9rem;
        }
        .swagger-ui .opblock-body .opblock-section-header > label {
            font-family: var(--font-main); color: var(--text-muted); font-size: 0.8rem;
        }
        .swagger-ui .opblock-body .opblock-section-header > label span {
            color: var(--text-muted);
        }

        /* ── Parameters table ───────────────────── */
        .swagger-ui table thead tr td, .swagger-ui table thead tr th {
            border-color: var(--border-color); color: var(--text-muted);
            font-family: var(--font-heading); font-size: 0.8rem; font-weight: 600;
            background: rgba(255, 255, 255, 0.02); padding: 10px 12px;
        }
        .swagger-ui table tbody tr td, .swagger-ui table tbody tr th {
            border-color: var(--border-color); color: var(--text-main);
            font-family: var(--font-main); padding: 10px 12px; font-size: 0.85rem;
            background: transparent;
        }
        .swagger-ui .parameter__name {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-weight: 600; font-size: 0.85rem;
        }
        .swagger-ui .parameter__type { color: var(--text-dim); font-size: 0.8rem; }
        .swagger-ui .parameter__in { color: var(--accent-blue); font-size: 0.75rem; }

        /* ── Response table ─────────────────────── */
        .swagger-ui .responses-inner { padding: 12px 16px; }
        .swagger-ui .responses-inner h4, .swagger-ui .responses-inner h5 {
            color: var(--text-main); font-family: var(--font-heading);
        }
        .swagger-ui .response-col_status { color: var(--text-main); }
        .swagger-ui .response-control-media-type__accept-message {
            color: var(--text-dim); font-size: 0.8rem;
        }
        .swagger-ui .response-control-media-type--small-title {
            color: var(--text-muted); font-size: 0.8rem;
        }
        .swagger-ui .response-col_description__inner div.markdown p {
            color: var(--text-muted); font-size: 0.85rem;
        }

        /* ── Forms: inputs, selects, textareas ──── */
        .swagger-ui input[type=text], .swagger-ui input[type=email],
        .swagger-ui input[type=password], .swagger-ui input[type=number],
        .swagger-ui input[type=search], .swagger-ui textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-input); border-radius: 6px;
            color: var(--text-main); font-family: var(--font-main);
            padding: 8px 12px; font-size: 0.85rem;
        }
        .swagger-ui input:focus, .swagger-ui textarea:focus {
            border-color: var(--accent-blue); outline: none; box-shadow: 0 0 0 3px rgba(91, 155, 213, 0.15);
        }
        .swagger-ui textarea {
            background: rgba(0, 0, 0, 0.3); font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }
        .swagger-ui select {
            background: var(--bg-elevated); border: 1px solid var(--border-input);
            border-radius: 6px; color: var(--text-main); font-family: var(--font-main);
            padding: 6px 12px; font-size: 0.85rem;
        }

        /* ── Buttons ────────────────────────────── */
        .swagger-ui .btn {
            border-radius: 6px; font-family: var(--font-heading); font-weight: 600;
            font-size: 0.85rem; padding: 8px 20px; border: none; text-shadow: none;
            transition: all 0.2s ease; box-shadow: none;
        }
        .swagger-ui .btn.authorize {
            background: var(--accent-gradient); color: var(--bg-primary);
        }
        .swagger-ui .btn.authorize:hover { opacity: 0.85; }
        .swagger-ui .btn.authorize span { background: transparent; }
        .swagger-ui .btn.authorize svg { fill: var(--bg-primary); }
        .swagger-ui .btn.cancel, .swagger-ui button.btn.cancel {
            background: transparent; color: var(--status-error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .swagger-ui .btn.execute {
            background: var(--accent-gradient); color: var(--bg-primary);
        }
        .swagger-ui .btn.execute:hover { opacity: 0.85; }

        /* ── Models ─────────────────────────────── */
        .swagger-ui .model-container {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 12px 16px; margin: 8px 0;
        }
        .swagger-ui .model-box {
            background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 12px;
        }
        .swagger-ui .model-box .model .brace-open,
        .swagger-ui .model-box .model .brace-close { color: var(--accent-blue); }
        .swagger-ui .model-box .model .property-name {
            color: var(--accent-cyan); font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }
        .swagger-ui .model-box .model .property-type { color: var(--status-warning); }
        .swagger-ui .model-box .model .property.required:after {
            color: var(--status-error);
        }
        .swagger-ui .model-box .model-toggle {
            color: var(--accent-blue); font-size: 0.75rem; cursor: pointer;
        }

        /* ── Modals ─────────────────────────────── */
        .swagger-ui .dialog-ux .modal-ux {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        .swagger-ui .dialog-ux .modal-ux-header {
            border-bottom: 1px solid var(--border-color);
            padding: 14px 20px;
        }
        .swagger-ui .dialog-ux .modal-ux-header h3 {
            font-family: var(--font-heading); color: var(--text-main); font-size: 1.1rem;
        }
        .swagger-ui .dialog-ux .modal-ux-content {
            color: var(--text-muted); padding: 14px 20px; font-size: 0.85rem;
        }
        .swagger-ui .dialog-ux .modal-ux-content label {
            color: var(--text-main); font-weight: 500; font-size: 0.85rem;
        }
        .swagger-ui .dialog-ux .modal-ux-content p {
            color: var(--text-muted); font-size: 0.85rem;
        }
        .swagger-ui .dialog-ux .modal-ux-content h4 {
            color: var(--text-main); font-family: var(--font-heading);
        }

        /* ── Links & general text ───────────────── */
        .swagger-ui a { color: var(--accent-blue); }
        .swagger-ui a:hover { color: var(--accent-cyan); }
        .swagger-ui .renderedMarkdown code, .swagger-ui code {
            background: rgba(125, 211, 192, 0.08); color: var(--accent-cyan);
            border-radius: 4px; padding: 1px 5px; font-family: 'SF Mono', monospace;
        }
        .swagger-ui .renderedMarkdown pre {
            background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        .swagger-ui .markdown p, .swagger-ui .markdown li {
            font-family: var(--font-main); color: var(--text-muted); font-size: 0.85rem;
        }

        /* ── Misc ───────────────────────────────── */
        .swagger-ui .expand-operation, .swagger-ui .opblock-control-arrow {
            fill: var(--text-muted);
        }
        .swagger-ui .no-margin { font-family: var(--font-main); }
        .swagger-ui section.models { border: 1px solid var(--border-color); }
        .swagger-ui section.models.is-open h4 {
            font-family: var(--font-heading); color: var(--text-main);
            background: transparent; border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
        }
        .swagger-ui section.models.is-open h4 svg { fill: var(--accent-cyan); }

        /* ── Filter bar ─────────────────────────── */
        .swagger-ui .filter-container {
            padding: 0 0 16px;
        }
        .swagger-ui .filter-container .operation-filter-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-input); border-radius: 6px;
            color: var(--text-main); font-family: var(--font-main);
            padding: 8px 14px; font-size: 0.9rem; margin-right: 12px;
            width: 360px;
        }
        .swagger-ui .filter-container .operation-filter-input:focus {
            border-color: var(--accent-blue); outline: none;
            box-shadow: 0 0 0 3px rgba(91, 155, 213, 0.15);
        }

        /* ── Scrollbar ──────────────────────────── */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: rgba(125, 211, 192, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(125, 211, 192, 0.35); }

        /* ── Loading ────────────────────────────── */
        .swagger-ui .loading-container .loading {
            color: var(--text-muted);
        }
        .swagger-ui .info .title small.version-stamp {
            background: rgba(125, 211, 192, 0.1); color: var(--accent-cyan);
            border-radius: 100px; padding: 2px 8px; font-size: 0.7rem;
        }
        .swagger-ui .info .title small { background: transparent; }
        .swagger-ui .info .title small pre {
            background: rgba(125, 211, 192, 0.08); border-radius: 100px;
            color: var(--accent-cyan); font-family: var(--font-main);
            font-weight: 600; font-size: 0.75rem;
        }

        /* ── JSON/example view ──────────────────── */
        .swagger-ui .highlight-code > .microlight {
            background: rgba(0, 0, 0, 0.35) !important;
            border: 1px solid var(--border-color); border-radius: 6px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            color: var(--text-main); font-size: 0.83rem; line-height: 1.5;
        }

        /* ── Response/request tabs ──────────────── */
        .swagger-ui .tab li button.tablinks {
            color: var(--text-muted); font-family: var(--font-main); font-size: 0.85rem;
        }
        .swagger-ui .tab li button.tablinks.active {
            color: var(--accent-cyan); border-bottom: 2px solid var(--accent-cyan);
        }

        /* ── Try-it-out executor ────────────────── */
        .swagger-ui .btn-group .btn.try-out__btn {
            background: transparent; color: var(--accent-blue);
            border: 1px solid var(--border-input); border-radius: 6px;
            font-family: var(--font-heading); font-weight: 600; text-shadow: none;
        }
        .swagger-ui .btn-group .btn.try-out__btn.cancel {
            color: var(--status-error); border-color: rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>
    <script>
      SwaggerUIBundle({
        url: "/swagger.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: "StandaloneLayout",
        defaultModelsExpandDepth: 0,
        docExpansion: "list",
        filter: true,
        showCommonExtensions: true,
        tryItOutEnabled: true,
        requestInterceptor: (req) => {
          req.headers['X-Project-Id'] = 'admin';
          return req;
        }
      });
    </script>
</body>
</html>
