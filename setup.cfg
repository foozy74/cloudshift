[metadata]
name = cloudshift
summary = CloudShift — VMware to OLVM/Hyper-V Migration as a Service
description_file =
    README.rst
author = thesolution.at
author_email = office@thesolution.at
home_page = https://cloudshift.thesolution.at
classifier =
    Environment :: OpenStack
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[files]
packages =
    coriolis

[global]
setup-hooks =
    pbr.hooks.setup_hook

[entry_points]
console_scripts =
    cloudshift-api = coriolis.cmd.api:main
    cloudshift-conductor = coriolis.cmd.conductor:main
    cloudshift-worker = coriolis.cmd.worker:main
    cloudshift-transfer-cron = coriolis.cmd.transfer_cron:main
    cloudshift-scheduler = coriolis.cmd.scheduler:main
    cloudshift-minion-manager = coriolis.cmd.minion_manager:main
    cloudshift-dbsync = coriolis.cmd.db_sync:main
    cloudshift-deployer-manager = coriolis.cmd.deployer_manager:main
    coriolis-api = coriolis.cmd.api:main
    coriolis-conductor = coriolis.cmd.conductor:main
    coriolis-worker = coriolis.cmd.worker:main
    coriolis-transfer-cron = coriolis.cmd.transfer_cron:main
    coriolis-scheduler = coriolis.cmd.scheduler:main
    coriolis-minion-manager = coriolis.cmd.minion_manager:main
    coriolis-dbsync = coriolis.cmd.db_sync:main
    coriolis-deployer-manager = coriolis.cmd.deployer_manager:main

coriolis.providers =
    vmware_vsphere = coriolis.providers.vmware.exp:VMwareVSphereExportProvider
    olvm = coriolis.providers.olvm.imp:OLVMoVirtImportProvider
    hyperv = coriolis.providers.hyperv.imp:HyperVImportProvider

[wheel]
universal = 1
